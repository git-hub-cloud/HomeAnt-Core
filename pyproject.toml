[project]
name = "homeant"
version = "0.1.0"
description = "Home Control by Agent — Control smart-home devices through AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant==2026.10.1",
    # mcp_server's own requirements, mirrored here so `uv sync` installs them
    # instead of HA fetching them at runtime.  Both are imported at module load
    # (http.py: aiohttp_sse on line 40, mcp on 43), and pywin32 — pulled in
    # transitively by mcp — only works once its .pth has been read at
    # interpreter start.  Installed at runtime that ordering is impossible, so
    # the first boot after a fresh install loses the /api/mcp route.
    # Keep in step with core/homeassistant/components/mcp_server/manifest.json.
    "mcp==1.28.1",
    "aiohttp_sse==2.2.0",
]

# Aliyun PyPI mirror (primary, replaces default pypi.org)
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# Override PyPI homeassistant with our locally patched submodule
# (3 Windows patches applied: runner.py, util/resource.py, helpers/signal.py)
[tool.uv.sources]
homeassistant = { path = "./core", editable = true }

[tool.uv]
package = false

