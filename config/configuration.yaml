# =============================================================================
# HomeAnt - Default HA config
#
# Deployed by './homeant start' (Linux/macOS) or '.\homeant start' (Windows) into ~/.homeant/.
# User-owned - if the target file already exists, it is NOT overwritten.
# =============================================================================

homeassistant:
  language: zh-Hans
  country: CN
  time_zone: Asia/Shanghai
webhook:            # OAuth / cloud callbacks
zeroconf:           # hard dependency of homeant_mdns and xiaomi_home
conversation:       # mcp_server deps: http + conversation -> intent + llm
                    # (llm registers the "assist" API that /api/mcp serves)
recorder:           # database behind history / logbook
history:            # history of states
logbook:            # logbook of events
homeant_mdns:       # mdns discovery of HomeAnt devices
homeant_voice:      # HomeAnt voice speaker
homeant_dlna:       # DLNA speaker bridge — signed view + play/select services
input_select:       # UI dropdown; options filled at runtime by homeant_voice_discover_speakers
  homeant_voice_speaker:
    name: HomeAnt Voice Speaker
    options:
      - unset
  homeant_dlna_speaker:
    name: HomeAnt DLNA Speaker
    options:
      - unset
input_text:         # Persistent record of the chosen speaker. input_select's
                    # options are filled only after startup, so on restore its
                    # saved value has no matching option and falls back to unset.
  homeant_voice_speaker:
    name: HomeAnt Voice Speaker (saved)
  homeant_dlna_speaker:
    name: HomeAnt DLNA Speaker (saved)
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
logger:
  # macOS: the uv python has no local-network permission, so HA core's
  # zeroconf socket logs a harmless "Errno 65 No route to host" at startup.
  # Our records are published by dns-sd there, so silence the library logger.
  # This does not affect custom_components.homeant_mdns (a different logger).
  logs:
    zeroconf: critical
